    <!-- Syne uniquement pour le logo — chargée en asynchrone (perf, audit
         PageSpeed mobile) : ce <link rel=stylesheet> bloquait le premier
         rendu de TOUTE la page pour une police qui ne sert qu'au logo. Le
         media="print" trompe le navigateur (feuille non appliquée au rendu
         actuel donc non bloquante) puis onload la re-bascule sur "all". Le
         <noscript> garde le comportement bloquant normal si JS est désactivé. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link id="syne-font" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap" rel="stylesheet" media="print">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap" rel="stylesheet"></noscript>
